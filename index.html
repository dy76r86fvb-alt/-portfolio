<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>资产监控 Pro</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Noto+Sans+SC:wght@300;400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #080A0F;
    --surface-summary: #151A22;
    --surface-asset: #FFFFFF;
    --border: #E8EEF4;
    --teal: #00E5C0;
    --orange: #FF8C00;
    --blue: #00A3FF;
    --green-tag: #39FF6E;
    --green-tag-bg: rgba(57,255,110,0.15);
    --red-tag: #FF4466;
    --red-tag-bg: rgba(255,68,102,0.1);
    --text-on-dark: #FFFFFF;
    --text-on-light: #1E2530;
    --muted-on-dark: #566370;
    --muted-on-light: #8090A0;
  }
  
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { width: 100%; overflow-x: hidden; background: var(--bg); font-family: 'Noto Sans SC', sans-serif; }
  body { padding: 24px 16px 100px; }

  .header { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 24px; padding: 0 4px; }
  .eyebrow { font-family: 'Space Mono', monospace; font-size: 10px; letter-spacing: 3px; color: var(--muted-on-dark); margin-bottom: 8px; text-transform: uppercase; }
  .total-area { display: flex; align-items: baseline; gap: 6px; }
  .total-symbol { font-size: 20px; color: var(--text-on-dark); font-weight: 300; }
  .total-val { font-family: 'Space Mono', monospace; font-size: 36px; font-weight: 700; color: #fff; line-height: 1; }
  .subtitle { font-family: 'Space Mono', monospace; font-size: 10px; color: var(--muted-on-dark); margin-top: 4px; }
  
  .refresh-btn {
    background: var(--surface-summary); border: 1px solid rgba(255,255,255,0.1);
    border-radius: 8px; color: var(--teal);
    font-family: 'Space Mono', monospace; font-size: 11px;
    padding: 10px 14px; cursor: pointer; display: flex; align-items: center; gap: 8px;
  }
  .spin { display: inline-block; animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .status-bar { display: flex; align-items: center; gap: 8px; margin-bottom: 24px; padding: 0 4px; font-family: 'Space Mono', monospace; font-size: 10px; color: var(--muted-on-dark); }
  .status-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--green-tag); }
  
  .summary-card { 
    background: var(--surface-summary); 
    border-radius: 16px; padding: 24px 16px; margin-bottom: 16px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.3); display: flex; align-items: center; gap: 16px;
  }
  .pie-wrap { position: relative; flex-shrink: 0; width: 110px; height: 110px; }
  .pie-wrap svg { transform: rotate(-90deg); }
  .pie-center { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); text-align: center; }
  .pie-center .lbl { font-family: 'Noto Sans SC', sans-serif; font-size: 10px; color: var(--muted-on-dark); display: block; margin-bottom: 2px; }
  .pie-center .val { font-family: 'Space Mono', monospace; font-size: 14px; font-weight: 700; color: #fff; }
  
  .pie-legend { flex: 1; min-width: 0; }
  .pie-legend-item { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
  .pie-legend-item:last-child { margin-bottom: 0; }
  .ldot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .linfo { flex: 1; min-width: 0; display: flex; align-items: center; justify-content: space-between;}
  .lname { font-size: 11px; color: var(--muted-on-dark); }
  .lval { font-family: 'Space Mono', monospace; font-size: 12px; font-weight: 700; color: #fff; text-align: right; }
  .lpct { font-family: 'Space Mono', monospace; font-size: 12px; flex-shrink: 0; font-weight: 700; width: 38px; text-align: right;}

  .asset-card { background: var(--surface-asset); border-radius: 16px; margin-bottom: 12px; overflow: hidden; box-shadow: 0 4px 16px rgba(0,0,0,0.1); }
  .asset-card-header { display: flex; align-items: center; justify-content: space-between; padding: 20px 16px; cursor: pointer; }
  .asset-title { font-size: 14px; color: var(--text-on-light); font-weight: 700; margin-bottom: 4px; }
  .asset-total { font-family: 'Space Mono', monospace; font-size: 18px; font-weight: 700; color: var(--text-on-light); }
  .asset-pct { font-family: 'Space Mono', monospace; font-size: 15px; font-weight: 700; }
  .asset-chev { font-size: 10px; color: var(--muted-on-light); transition: transform 0.2s; }
  
  .asset-card.collapsed .asset-items { display: none; }
  .asset-card.collapsed .asset-chev { transform: rotate(-90deg); }

  .asset-items { border-top: 1px solid var(--border); padding: 0 16px; }
  .asset-item { display: flex; align-items: center; padding: 14px 0; border-bottom: 1px solid var(--border); gap: 10px; }
  .asset-item:last-child { border-bottom: none; }
  .iicon { font-size: 16px; width: 24px; text-align: center; flex-shrink: 0; }
  .iinfo { flex: 1; min-width: 0; }
  .iname { font-size: 12px; color: var(--text-on-light); font-weight: 500; margin-bottom: 2px; }
  .iprice { font-family: 'Space Mono', monospace; font-size: 10px; color: var(--muted-on-light); }
  .ival { font-family: 'Space Mono', monospace; font-size: 14px; color: var(--text-on-light); font-weight: 700; flex-shrink: 0; text-align: right; }
  .itag { font-family: 'Space Mono', monospace; font-size: 10px; padding: 3px 6px; border-radius: 4px; font-weight: 700; }
  .itag-sm { font-family: 'Space Mono', monospace; font-size: 9px; padding: 2px 4px; border-radius: 4px; font-weight: 700; }
  
  .tg { color: var(--green-tag) !important; background: var(--green-tag-bg) !important; }
  .tr { color: var(--red-tag) !important; background: var(--red-tag-bg) !important; }
  .tn { color: var(--muted-on-light) !important; background: #F1F4F8 !important; }

  .edit-btn {
    position: fixed; bottom: 24px; right: 20px;
    background: var(--teal); color: #000; border: none;
    border-radius: 50px; padding: 14px 24px;
    font-family: 'Space Mono', monospace; font-size: 12px; font-weight: 700;
    cursor: pointer; box-shadow: 0 8px 32px rgba(0,229,192,0.4);
    z-index: 50; display: flex; align-items: center; gap: 8px;
  }

  .overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 100; overflow-y: auto; padding: 10px 10px 40px; }
  .overlay.open { display: block; }
  .modal {
    background: var(--surface-summary); border: 1px solid rgba(255,255,255,0.05);
    border-radius: 20px; padding: 24px 12px; max-width: 520px; margin: 0 auto;
    position: relative; box-shadow: 0 16px 64px rgba(0,0,0,0.5);
  }
  .modal-close { position: absolute; top: 20px; right: 20px; color: var(--muted-on-dark); font-size: 20px; cursor: pointer; padding: 4px; }
  .modal-title { font-family: 'Space Mono', monospace; font-size: 13px; color: var(--teal); margin-bottom: 24px; letter-spacing: 1px; font-weight: 700; padding-left: 4px; }
  .modal-content { max-height: 70vh; overflow-y: auto; padding-right: 4px; }
  
  .modal-sec-header { display: flex; align-items: center; justify-content: space-between; margin: 20px 0 12px; padding: 0 4px; }
  .modal-sec-title { font-size: 11px; color: var(--muted-on-dark); text-transform: uppercase; letter-spacing: 1px; }
  .btn-add-mini { background: rgba(0,229,192,0.1); color: var(--teal); border: 1px solid var(--teal); border-radius: 6px; padding: 4px 8px; font-size: 10px; cursor: pointer; }

  .modal-input-card { background: rgba(255,255,255,0.03); border-radius: 12px; padding: 10px 6px; margin-bottom: 8px; display: flex; align-items: center; gap: 4px; border: 1px solid rgba(255,255,255,0.03); }
  .btn-del { color: #FF4466; background: none; border: none; font-size: 16px; cursor: pointer; padding: 0 2px; }
  .btn-move { color: #8090A0; background: none; border: none; font-size: 10px; cursor: pointer; padding: 2px; }
  
  .modal-input-card input {
    background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.1);
    border-radius: 6px; color: #fff; font-family: 'Space Mono', monospace; font-size: 12px;
    padding: 8px 4px; outline: none;
  }
  .in-icon { width: 28px; text-align: center; }
  .in-name { flex: 1; min-width: 35px; }
  .in-gain { width: 55px; text-align: center; font-size: 10px !important; }
  .in-val { width: 75px; text-align: right; }
  .in-val-sm { width: 50px; text-align: center; font-size: 10px !important; padding: 8px 2px !important; }
  
  .modal-input-card input:focus { border-color: var(--teal); }
  
  .mactions { display: flex; gap: 12px; margin-top: 24px; padding: 0 4px; }
  .btn-save { flex: 1; background: var(--teal); color: #000; border: none; border-radius: 10px; padding: 14px; font-family: 'Space Mono', monospace; font-size: 12px; font-weight: 700; cursor: pointer; }
  .btn-cancel { flex: 1; background: rgba(255,255,255,0.05); color: var(--muted-on-dark); border: 1px solid rgba(255,255,255,0.05); border-radius: 10px; padding: 14px; font-family: 'Space Mono', monospace; font-size: 12px; cursor: pointer; }
</style>
</head>
<body>

<div class="header">
  <div>
    <div class="eyebrow">MY PORTFOLIO</div>
    <div class="total-area">
      <span class="total-symbol">¥</span>
      <span class="total-val" id="totalDisplay">—</span>
    </div>
    <div class="subtitle" id="lastUpdate">最后更新：正在加载...</div>
  </div>
  <button class="refresh-btn" onclick="fetchPrices()">
    <span id="refreshIcon">↻</span> 刷新
  </button>
</div>

<div class="status-bar">
  <div class="status-dot"></div>
  <span id="statusText">实时汇率 & OKX行情接入中</span>
</div>

<div class="summary-card">
  <div class="pie-wrap">
    <svg width="110" height="110" viewBox="0 0 100 100">
      <circle cx="50" cy="50" r="38" fill="none" stroke="#252A35" stroke-width="14"/>
      <circle cx="50" cy="50" r="38" fill="none" stroke="#00E5C0" stroke-width="14" id="pieStock" stroke-dasharray="0 238.9"/>
      <circle cx="50" cy="50" r="38" fill="none" stroke="#FF8C00" stroke-width="14" id="pieCrypto" stroke-dasharray="0 238.9" stroke-dashoffset="0"/>
      <circle cx="50" cy="50" r="38" fill="none" stroke="#00A3FF" stroke-width="14" id="pieUsStock" stroke-dasharray="0 238.9" stroke-dashoffset="0"/>
    </svg>
    <div class="pie-center">
      <span class="lbl">总资产</span>
      <span class="val" id="pieTotalVal">—</span>
    </div>
  </div>
  <div class="pie-legend">
    <div class="pie-legend-item">
      <div class="ldot" style="background:var(--teal)"></div>
      <div class="linfo"><div class="lname">传统资产</div><div class="lval" id="stockTotalDisplay">¥—</div></div>
      <div class="lpct" style="color:var(--teal)" id="stockPctDisplay">—%</div>
    </div>
    <div class="pie-legend-item">
      <div class="ldot" style="background:var(--blue)"></div>
      <div class="linfo"><div class="lname">股票(U本位)</div><div class="lval" id="usStockTotalDisplay">¥—</div></div>
      <div class="lpct" style="color:var(--blue)" id="usStockPctDisplay">—%</div>
    </div>
    <div class="pie-legend-item">
      <div class="ldot" style="background:var(--orange)"></div>
      <div class="linfo"><div class="lname">币圈资产</div><div class="lval" id="cryptoTotalDisplay">¥—</div></div>
      <div class="lpct" style="color:var(--orange)" id="cryptoPctDisplay">—%</div>
    </div>
  </div>
</div>

<div class="asset-card" id="stockSection">
  <div class="asset-card-header" onclick="toggleSection('stockSection')">
    <div class="shl"><div class="asset-title">传统资产</div><div class="asset-total" id="stockSectionTotal">¥—</div></div>
    <div style="display:flex;align-items:center;gap:10px">
      <div class="asset-pct" style="color:var(--teal)" id="stockSectionPct">—%</div>
      <div class="asset-chev">▼</div>
    </div>
  </div>
  <div class="asset-items" id="stockItems"></div>
</div>

<div class="asset-card" id="usStockSection">
  <div class="asset-card-header" onclick="toggleSection('usStockSection')">
    <div class="shl"><div class="asset-title">股票资产</div><div class="asset-total" id="usStockSectionTotal">¥—</div></div>
    <div style="display:flex;align-items:center;gap:10px">
      <div class="asset-pct" style="color:var(--blue)" id="usStockSectionPct">—%</div>
      <div class="asset-chev">▼</div>
    </div>
  </div>
  <div class="asset-items" id="usStockItems"></div>
</div>

<div class="asset-card" id="cryptoSection">
  <div class="asset-card-header" onclick="toggleSection('cryptoSection')">
    <div class="shl"><div class="asset-title">币圈资产</div><div class="asset-total" id="cryptoSectionTotal">¥—</div></div>
    <div style="display:flex;align-items:center;gap:10px">
      <div class="asset-pct" style="color:var(--orange)" id="cryptoSectionPct">—%</div>
      <div class="asset-chev">▼</div>
    </div>
  </div>
  <div class="asset-items" id="cryptoItems"></div>
</div>

<button class="edit-btn" onclick="openModal()">✎ 编辑持仓</button>

<div class="overlay" id="overlay">
  <div class="modal">
    <div class="modal-close" onclick="closeModal()">✕</div>
    <div class="modal-title">✎ 编辑资产</div>
    <div class="modal-content">
      
      <div class="modal-sec-header">
        <div class="modal-sec-title">🏦 传统资产 (¥)</div>
        <button class="btn-add-mini" onclick="addNewAsset('stocks')">+ 添加</button>
      </div>
      <div id="stockInputs"></div>

      <div class="modal-sec-header">
        <div class="modal-sec-title">📈 股票资产 (单位: U)</div>
        <button class="btn-add-mini" onclick="addNewAsset('usStocks')">+ 添加</button>
      </div>
      <div style="font-size:10px; color:var(--muted-on-dark); padding-left:4px; margin-bottom:8px; display:flex;">
        <span style="flex:1; margin-left:55px;">名称</span>
        <span style="width:50px; text-align:center;">数量</span>
        <span style="width:50px; text-align:center;">成本价</span>
        <span style="width:50px; text-align:center;">现价</span>
      </div>
      <div id="usStockInputs"></div>

      <div class="modal-sec-header">
        <div class="modal-sec-title">🪙 币圈资产 (数量)</div>
        <button class="btn-add-mini" onclick="addNewAsset('crypto')">+ 添加</button>
      </div>
      <div id="cryptoInputs"></div>

      <div class="modal-sec-header"><div class="modal-sec-title">⚙️ 汇率设置</div></div>
      <div class="modal-input-card" style="padding: 10px 16px;">
        <span style="font-size:12px;color:#fff;flex:1">💵 美元兑人民币</span>
        <input type="number" id="inputRate" style="width:100px;text-align:right;" step="0.01">
      </div>

    </div>
    <div class="mactions">
      <button class="btn-cancel" onclick="closeModal()">取消</button>
      <button class="btn-save" onclick="saveAndClose()">保存</button>
    </div>
  </div>
</div>

<script>
// 初始化默认数据（严格按照图片复刻，升级至 v12 防止缓存冲突）
let defaultData = {
  usdRate: 6.80, // 根据 USDT 5.85U 对应 39.77 反推得出
  stocks: [
    { name: '华安纳斯达克100',       icon: '📈', gain: '+15.18%', value: 653.50 },
    { name: '华安纳斯达克100 (APP)', icon: '📈', gain: '+4.07%',  value: 207.34 },
    { name: '3倍做多纳斯达克100ETF', icon: '💰', gain: '+10%',    value: 149.25 },
    { name: '摩根标普500',           icon: '📈', gain: '+5.75%',  value: 896.57 },
    { name: '广发纳斯达克100',       icon: '📈', gain: '+22.79%', value: 122.79 },
    { name: '易方达标普500',         icon: '📈', gain: '+11.39%', value: 89.11 },
    { name: '余额宝',                icon: '🏦', gain: '活期',    value: 60.00 },
    { name: '银行卡',                icon: '💳', gain: '储蓄',    value: 0.00 }
  ],
  usStocks: [], // 保留了功能结构，但默认不添加假数据
  crypto: [
    { symbol: 'BTC',   icon: '₿',  qty: 0.0007805 },
    { symbol: 'USDT',  icon: '💵', qty: 5.85 },
    { symbol: 'ETH',   icon: 'Ξ',  qty: 0.01251 },
    { symbol: 'SOL',   icon: '◎',  qty: 0.11268 },
    { symbol: 'BNB',   icon: '🔶', qty: 0.010108 },
    { symbol: 'PENGU', icon: '🐧', qty: 642.96 },
    { symbol: 'PEPE',  icon: '🐸', qty: 1482430.8 },
    { symbol: 'AAVE',  icon: '👻', qty: 0.0519 },
    { symbol: 'DOGE',  icon: '🐕', qty: 26.94 }
  ]
};

let holdings = JSON.parse(localStorage.getItem('portfolio_v12')) || defaultData;
if (!holdings.usStocks) holdings.usStocks = defaultData.usStocks; 

let prices = {};
let tempHoldings = null;

async function fetchPrices() {
  const refreshIcon = document.getElementById('refreshIcon');
  refreshIcon.classList.add('spin');
  const symbols = holdings.crypto.map(c => c.symbol).filter(s => s !== 'USDT');
  try {
    const results = await Promise.all(symbols.map(s => fetch(`https://www.okx.com/api/v5/market/ticker?instId=${s}-USDT`).then(r => r.json()).catch(() => null)));
    results.forEach((r, i) => { if (r?.data?.[0]) prices[symbols[i]] = parseFloat(r.data[0].last); });
    prices['USDT'] = 1;
    document.getElementById('lastUpdate').textContent = `最后更新：${new Date().toTimeString().split(' ')[0]}`;
  } catch(e) {}
  refreshIcon.classList.remove('spin');
  render();
}

function render() {
  const rate = holdings.usdRate;
  
  // 1. 传统资产 (CNY)
  const stockTotal = holdings.stocks.reduce((s, x) => s + x.value, 0);
  
  // 2. 股票资产 (USD转CNY)
  let usStockUsdTotal = holdings.usStocks.reduce((s, u) => s + (u.qty * u.currentPrice), 0);
  let usStockTotal = usStockUsdTotal * rate;

  // 3. 币圈资产 (USD转CNY)
  let cryptoTotal = holdings.crypto.reduce((s, c) => s + (c.qty * (prices[c.symbol] || 0) * rate), 0);
  
  // 总计
  const grand = stockTotal + usStockTotal + cryptoTotal;
  
  // 占比计算
  const sp = grand ? (stockTotal / grand) : 0;
  const up = grand ? (usStockTotal / grand) : 0;
  const cp = grand ? (cryptoTotal / grand) : 0;

  // UI 顶部与图例更新
  document.getElementById('totalDisplay').textContent = grand.toLocaleString(undefined, {maximumFractionDigits:2});
  document.getElementById('pieTotalVal').textContent = '¥' + Math.round(grand);
  
  document.getElementById('stockTotalDisplay').textContent = '¥' + Math.round(stockTotal);
  document.getElementById('stockPctDisplay').textContent = (sp * 100).toFixed(1) + '%';
  
  document.getElementById('usStockTotalDisplay').textContent = '¥' + Math.round(usStockTotal);
  document.getElementById('usStockPctDisplay').textContent = (up * 100).toFixed(1) + '%';

  document.getElementById('cryptoTotalDisplay').textContent = '¥' + Math.round(cryptoTotal);
  document.getElementById('cryptoPctDisplay').textContent = (cp * 100).toFixed(1) + '%';

  // 卡片头部更新
  document.getElementById('stockSectionTotal').textContent = '¥' + stockTotal.toFixed(2);
  document.getElementById('stockSectionPct').textContent = (sp * 100).toFixed(1) + '%';
  
  document.getElementById('usStockSectionTotal').textContent = '¥' + usStockTotal.toFixed(2);
  document.getElementById('usStockSectionPct').textContent = (up * 100).toFixed(1) + '%';

  document.getElementById('cryptoSectionTotal').textContent = '¥' + cryptoTotal.toFixed(2);
  document.getElementById('cryptoSectionPct').textContent = (cp * 100).toFixed(1) + '%';

  // 饼状图 SVG 绘制 (圆周长 238.9)
  const C = 238.9;
  document.getElementById('pieStock').setAttribute('stroke-dasharray', `${sp*C} ${C}`);
  
  document.getElementById('pieUsStock').setAttribute('stroke-dasharray', `${up*C} ${C}`);
  document.getElementById('pieUsStock').setAttribute('stroke-dashoffset', `-${sp*C}`);
  
  document.getElementById('pieCrypto').setAttribute('stroke-dasharray', `${cp*C} ${C}`);
  document.getElementById('pieCrypto').setAttribute('stroke-dashoffset', `-${(sp+up)*C}`);

  // 渲染传统资产列表
  document.getElementById('stockItems').innerHTML = holdings.stocks.map(s => `
    <div class="asset-item">
      <div class="iicon">${s.icon}</div>
      <div class="iinfo"><div class="iname">${s.name}</div></div>
      <div class="ival">
        <div>¥${s.value.toFixed(2)}</div>
        <span class="itag ${s.gain.includes('+') ? 'tg' : (s.gain.includes('-')?'tr':'tn')}">${s.gain}</span>
      </div>
    </div>`).join('');

  // 渲染股票资产列表
  if (holdings.usStocks.length === 0) {
      document.getElementById('usStockItems').innerHTML = `<div style="padding:16px;text-align:center;font-size:12px;color:var(--muted-on-light)">暂无数据，请点击下方编辑添加</div>`;
  } else {
      document.getElementById('usStockItems').innerHTML = holdings.usStocks.map(u => {
        const usdVal = u.qty * u.currentPrice;
        const cnyVal = usdVal * rate;
        const pnlPct = u.costPrice > 0 ? ((u.currentPrice - u.costPrice) / u.costPrice * 100) : 0;
        const pnlClass = pnlPct >= 0 ? 'tg' : 'tr';
        const pnlStr = pnlPct > 0 ? `+${pnlPct.toFixed(2)}%` : `${pnlPct.toFixed(2)}%`;
        
        return `
        <div class="asset-item">
          <div class="iicon">${u.icon}</div>
          <div class="iinfo">
            <div class="iname">${u.name}</div>
            <div class="iprice">持仓 ${u.qty} | 成本 $${u.costPrice}</div>
          </div>
          <div class="ival">
            <div>¥${cnyVal.toFixed(2)}</div>
            <div style="display:flex; justify-content:flex-end; align-items:center; gap:6px;">
              <span class="iprice">${usdVal.toFixed(2)}U</span>
              <span class="itag-sm ${pnlClass}">${pnlStr}</span>
            </div>
          </div>
        </div>`;
      }).join('');
  }

  // 渲染币圈资产列表
  document.getElementById('cryptoItems').innerHTML = holdings.crypto.map(c => {
    const p = prices[c.symbol] || 0;
    const usd = c.qty * p;
    return `
    <div class="asset-item">
      <div class="iicon">${c.icon}</div>
      <div class="iinfo">
        <div class="iname">${c.symbol}</div>
        <div class="iprice">${p > 0 ? (c.symbol==='USDT'?'¥'+rate.toFixed(2):'$'+(p<1?p.toFixed(5):p.toLocaleString())):'获取中...'}</div>
      </div>
      <div class="ival">
        <div>¥${(usd*rate).toFixed(2)}</div>
        <div class="iprice">${usd.toFixed(2)}U</div>
      </div>
    </div>`;
  }).join('');
}

function toggleSection(id) { document.getElementById(id).classList.toggle('collapsed'); }

function openModal() {
  tempHoldings = JSON.parse(JSON.stringify(holdings)); 
  renderModalInputs();
  document.getElementById('inputRate').value = tempHoldings.usdRate;
  document.getElementById('overlay').classList.add('open');
}

function renderModalInputs() {
  // 渲染传统资产编辑
  document.getElementById('stockInputs').innerHTML = tempHoldings.stocks.map((s, i) => `
    <div class="modal-input-card">
      <div style="display:flex; flex-direction:column; gap:2px;">
        <button class="btn-move" onclick="moveAsset('stocks', ${i}, -1)" style="${i===0?'visibility:hidden':''}">&nbsp;▲&nbsp;</button>
        <button class="btn-move" onclick="moveAsset('stocks', ${i}, 1)" style="${i===tempHoldings.stocks.length-1?'visibility:hidden':''}">&nbsp;▼&nbsp;</button>
      </div>
      <button class="btn-del" onclick="removeAsset('stocks', ${i})">✕</button>
      <input type="text" class="in-icon" value="${s.icon}" onchange="updateTemp('stocks', ${i}, 'icon', this.value)">
      <input type="text" class="in-name" value="${s.name}" placeholder="名称" onchange="updateTemp('stocks', ${i}, 'name', this.value)">
      <input type="text" class="in-gain" value="${s.gain}" placeholder="涨幅" onchange="updateTemp('stocks', ${i}, 'gain', this.value)">
      <input type="number" class="in-val" value="${s.value}" step="0.01" onchange="updateTemp('stocks', ${i}, 'value', this.value)">
    </div>`).join('');

  // 渲染股票资产编辑
  document.getElementById('usStockInputs').innerHTML = tempHoldings.usStocks.map((u, i) => `
    <div class="modal-input-card">
      <div style="display:flex; flex-direction:column; gap:2px;">
        <button class="btn-move" onclick="moveAsset('usStocks', ${i}, -1)" style="${i===0?'visibility:hidden':''}">&nbsp;▲&nbsp;</button>
        <button class="btn-move" onclick="moveAsset('usStocks', ${i}, 1)" style="${i===tempHoldings.usStocks.length-1?'visibility:hidden':''}">&nbsp;▼&nbsp;</button>
      </div>
      <button class="btn-del" onclick="removeAsset('usStocks', ${i})">✕</button>
      <input type="text" class="in-icon" value="${u.icon}" onchange="updateTemp('usStocks', ${i}, 'icon', this.value)">
      <input type="text" class="in-name" value="${u.name}" placeholder="名称" onchange="updateTemp('usStocks', ${i}, 'name', this.value)">
      <input type="number" class="in-val-sm" value="${u.qty}" step="any" placeholder="数量" onchange="updateTemp('usStocks', ${i}, 'qty', this.value)">
      <input type="number" class="in-val-sm" value="${u.costPrice}" step="any" placeholder="成本" onchange="updateTemp('usStocks', ${i}, 'costPrice', this.value)">
      <input type="number" class="in-val-sm" value="${u.currentPrice}" step="any" placeholder="现价" onchange="updateTemp('usStocks', ${i}, 'currentPrice', this.value)">
    </div>`).join('');

  // 渲染币圈资产编辑
  document.getElementById('cryptoInputs').innerHTML = tempHoldings.crypto.map((c, i) => `
    <div class="modal-input-card">
      <div style="display:flex; flex-direction:column; gap:2px;">
        <button class="btn-move" onclick="moveAsset('crypto', ${i}, -1)" style="${i===0?'visibility:hidden':''}">&nbsp;▲&nbsp;</button>
        <button class="btn-move" onclick="moveAsset('crypto', ${i}, 1)" style="${i===tempHoldings.crypto.length-1?'visibility:hidden':''}">&nbsp;▼&nbsp;</button>
      </div>
      <button class="btn-del" onclick="removeAsset('crypto', ${i})">✕</button>
      <input type="text" class="in-icon" value="${c.icon}" onchange="updateTemp('crypto', ${i}, 'icon', this.value)">
      <input type="text" class="in-name" value="${c.symbol}" placeholder="代码" onchange="updateTemp('crypto', ${i}, 'symbol', this.value.toUpperCase())">
      <input type="number" class="in-val" value="${c.qty}" step="any" onchange="updateTemp('crypto', ${i}, 'qty', this.value)">
    </div>`).join('');
}

function moveAsset(type, index, direction) {
  const newIndex = index + direction;
  if (newIndex < 0 || newIndex >= tempHoldings[type].length) return;
  const temp = tempHoldings[type][index];
  tempHoldings[type][index] = tempHoldings[type][newIndex];
  tempHoldings[type][newIndex] = temp;
  renderModalInputs();
}

function updateTemp(type, index, field, val) {
  if (field === 'value' || field === 'qty' || field === 'costPrice' || field === 'currentPrice') val = parseFloat(val) || 0;
  tempHoldings[type][index][field] = val;
}

function addNewAsset(type) {
  if (type === 'stocks') tempHoldings.stocks.push({ name: '新资产', icon: '💰', value: 0, gain: '+0%' });
  else if (type === 'usStocks') tempHoldings.usStocks.push({ name: '新股票', icon: '📈', qty: 0, costPrice: 0, currentPrice: 0 });
  else tempHoldings.crypto.push({ symbol: 'NEW', icon: '🪙', qty: 0 });
  renderModalInputs();
}

function removeAsset(type, index) {
  tempHoldings[type].splice(index, 1);
  renderModalInputs();
}

function closeModal() { document.getElementById('overlay').classList.remove('open'); }

function saveAndClose() {
  tempHoldings.usdRate = parseFloat(document.getElementById('inputRate').value) || holdings.usdRate;
  holdings = tempHoldings;
  localStorage.setItem('portfolio_v12', JSON.stringify(holdings));
  closeModal();
  fetchPrices();
}

// 初始化运行
fetchPrices();
setInterval(fetchPrices, 30000); 
</script>
</body>
</html>
